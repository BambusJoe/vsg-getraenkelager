<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#009FE3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E2131" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Getränke">
<title>VSG Getränkelager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#009FE3; --brand-deep:#0072AB; --brand-glow:#38C6FF; --brand-text:#0068A0;
  --ink:#0B0D12; --ink-2:#48586A; --ink-3:#8393A3;
  --paper:#FFFFFF; --paper-2:#F0F6FB; --paper-3:#E4EFF7;
  --line:#D7E4EF; --line-2:#E7F0F7;
  /* Ampel-Semantik */
  --ok:#0F8F49; --ok-ink:#0B7A3C; --ok-bg:#E4F6EC; --ok-dot:#16A94F;
  --warn-ink:#8A4F08; --warn-bg:#FBEED8; --warn-dot:#ED9E2C;
  --bad-ink:#B12A2E; --bad-bg:#FCE6E6; --bad-dot:#E5484D;
  --shadow: 0 1px 2px rgba(15,18,24,.06), 0 3px 8px -5px rgba(15,18,24,.18);
  --shadow-lg: 0 2px 5px rgba(15,18,24,.1), 0 14px 30px -20px rgba(15,18,24,.4);
  --ui:"Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --display:"Archivo", var(--ui);
  --stage:#DCE9F2;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#EAF2F8; --ink-2:#A9BDCE; --ink-3:#8093A5;
    --brand-text:#5CBEEF;
    --paper:#0F1A24; --paper-2:#13212E; --paper-3:#1A2C3C;
    --line:#243848; --line-2:#1B2C3B;
    --ok:#3FD07E; --ok-ink:#7EE3A8; --ok-bg:#0F2C1E; --ok-dot:#31C878;
    --warn-ink:#F2C57C; --warn-bg:#2A2012; --warn-dot:#F0B44E;
    --bad-ink:#F3A2A4; --bad-bg:#2E1618; --bad-dot:#F0686C;
    --stage:#060D14;
    --shadow: 0 1px 2px rgba(0,0,0,.45), 0 3px 9px -6px rgba(0,0,0,.6);
    --shadow-lg: 0 2px 6px rgba(0,0,0,.5), 0 16px 34px -22px rgba(0,0,0,.8);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:var(--ui); color:var(--ink); background:var(--stage);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  min-height:100dvh; display:grid; place-items:center; padding:28px 16px;
}
::selection{background:rgba(0,159,227,.24)}
button{font:inherit; color:inherit}
:focus-visible{outline:2.5px solid var(--brand); outline-offset:2px; border-radius:10px}
.tnum{font-variant-numeric:tabular-nums; font-family:var(--display)}

/* ---------- Desktop-Hinweis ---------- */
.stage-note{position:fixed; left:24px; top:24px; max-width:250px; font-size:12.5px; line-height:1.55; color:var(--ink-2)}
.stage-note b{color:var(--ink); font-weight:700; font-family:var(--display)}
.stage-note .lbl{display:inline-flex; align-items:center; gap:7px; font-weight:700; color:var(--brand-text); margin-bottom:8px}
.stage-note svg{width:16px;height:16px}
@media (max-width:1060px){.stage-note{display:none}}

/* ---------- Phone-Frame ---------- */
.phone{
  width:390px; max-width:100%;
  height:min(844px, calc(100dvh - 56px));
  background:var(--paper); border-radius:44px; position:relative; overflow:hidden;
  box-shadow: var(--shadow-lg), 0 0 0 11px #0B0D12, 0 0 0 12px #263241;
  display:flex; flex-direction:column;
}
.notch{position:absolute; top:0; left:50%; transform:translateX(-50%); width:148px; height:30px;
  background:#0B0D12; border-radius:0 0 18px 18px; z-index:60}
@media (max-width:430px){
  html,body{height:var(--appvh,100dvh); overflow:hidden; background:var(--paper)}
  body{padding:0; display:block}
  .phone{width:100%; height:var(--appvh,100dvh); border-radius:0; box-shadow:none}
  .notch{display:none}
}

/* ---------- Splash ---------- */
.splash{position:absolute; inset:0; z-index:90; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px;
  background:radial-gradient(120% 80% at 50% 32%, rgba(0,159,227,.32), transparent 60%), linear-gradient(180deg,#0E2131,#071019);
  transition:opacity .5s ease; opacity:1}
.splash.hide{opacity:0; pointer-events:none}
.splash img{height:132px; width:auto; filter:drop-shadow(0 10px 30px rgba(0,0,0,.45)); animation:splashIn .7s cubic-bezier(.2,.9,.25,1) both}
.splash .cap{font-family:var(--display); font-weight:700; font-size:13px; letter-spacing:.16em; text-transform:uppercase; color:#9Fc8e4}
@keyframes splashIn{from{opacity:0; transform:scale(.86) translateY(8px)} to{opacity:1; transform:none}}
.splash-bar{width:120px; height:3px; border-radius:3px; background:rgba(255,255,255,.18); overflow:hidden}
.splash-bar span{display:block; height:100%; width:0; border-radius:3px; background:#fff; animation:splashBar 1.2s cubic-bezier(.4,.1,.2,1) forwards}
@keyframes splashBar{from{width:0} to{width:100%}}
@media (prefers-reduced-motion: reduce){.splash img,.splash-bar span{animation:none} .splash-bar span{width:100%}}

/* ---------- App-Gerüst ---------- */
.app{display:flex; flex-direction:column; height:100%; background:var(--paper)}
.scroll{flex:1; overflow-y:auto; overflow-x:hidden; scrollbar-width:thin; scrollbar-color:var(--line) transparent; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; padding-bottom:16px}
.scroll::-webkit-scrollbar{width:8px}
.scroll::-webkit-scrollbar-thumb{background:var(--line); border-radius:20px; border:2px solid transparent; background-clip:content-box}

.topbar{
  position:sticky; top:0; z-index:40; background:color-mix(in oklab, var(--paper) 86%, transparent);
  backdrop-filter:saturate(1.3) blur(14px); -webkit-backdrop-filter:saturate(1.3) blur(14px);
  padding:46px 18px 12px; display:flex; align-items:center; gap:11px; border-bottom:1px solid var(--line);
}
@media (max-width:430px){.topbar{padding-top:calc(env(safe-area-inset-top) + 12px)}}
.crest{width:36px;height:36px;border-radius:10px;overflow:hidden; flex:none; box-shadow:0 4px 12px -6px rgba(3,14,24,.6); background:#fff}
.crest img{width:100%;height:100%;object-fit:contain}
.brand{margin-right:auto; line-height:1.05}
.brand b{font-family:var(--display); font-weight:800; font-size:16px; letter-spacing:-.02em; display:block}
.brand span{font-size:11px; color:var(--ink-3); font-weight:600; letter-spacing:.12em; text-transform:uppercase}
.mebtn{display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line); background:var(--paper);
  border-radius:11px; padding:7px 11px 7px 9px; cursor:pointer; max-width:150px}
.mebtn svg{width:16px;height:16px;color:var(--brand-text); flex:none}
.mebtn .who{min-width:0; text-align:left; line-height:1.1}
.mebtn .who small{display:block; font-size:11px; color:var(--ink-3); font-weight:700; letter-spacing:.08em; text-transform:uppercase; line-height:1.1}
.mebtn .who b{font-family:var(--display); font-weight:700; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:96px}
.mebtn:active{transform:scale(.97)}

/* ---------- View-Umschaltung ---------- */
.view{display:none; animation:viewIn .28s cubic-bezier(.2,.8,.25,1)}
.view.on{display:block}
@keyframes viewIn{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion: reduce){.view{animation:none}}

.pad{padding:0 18px}
.pagehead{padding:18px 18px 2px}
.pagehead h1{margin:0; font-family:var(--display); font-weight:800; font-size:25px; letter-spacing:-.03em}
.pagehead .meta{margin-top:5px; font-size:12.5px; color:var(--ink-3); font-weight:600; display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.pagehead .meta .now{width:6px;height:6px;border-radius:50%;background:var(--ok-dot)}

/* ---------- Verdict-Banner ---------- */
.verdict{margin:14px 18px 4px; border-radius:20px; padding:16px 16px 15px; position:relative; overflow:hidden;
  border:1px solid transparent; box-shadow:var(--shadow)}
.verdict.ok{background:var(--ok-bg); border-color:color-mix(in oklab, var(--ok-dot) 34%, transparent)}
.verdict.warn{background:var(--warn-bg); border-color:color-mix(in oklab, var(--warn-dot) 40%, transparent)}
.verdict.bad{background:var(--bad-bg); border-color:color-mix(in oklab, var(--bad-dot) 42%, transparent)}
.verdict .vhead{display:flex; align-items:center; gap:12px}
.vicon{width:44px;height:44px;border-radius:13px; flex:none; display:grid; place-items:center; color:#fff}
.verdict.ok .vicon{background:linear-gradient(150deg,var(--ok-dot),#0C8B44)}
.verdict.warn .vicon{background:linear-gradient(150deg,var(--warn-dot),#C87C12)}
.verdict.bad .vicon{background:linear-gradient(150deg,#EE5A5E,var(--bad-dot))}
.vicon svg{width:25px;height:25px}
.verdict h2{margin:0; font-family:var(--display); font-weight:800; font-size:19px; letter-spacing:-.02em; line-height:1.1}
.verdict.ok h2{color:var(--ok-ink)} .verdict.warn h2{color:var(--warn-ink)} .verdict.bad h2{color:var(--bad-ink)}
.verdict .vsub{font-size:13px; font-weight:600; margin-top:2px; color:var(--ink-2)}
.verdict .vchips{display:flex; flex-wrap:wrap; gap:6px; margin-top:13px}
.vchip{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; padding:5px 10px; border-radius:9px;
  background:color-mix(in oklab, var(--paper) 72%, transparent); color:var(--ink)}
.vchip .cd{width:7px;height:7px;border-radius:50%}
.vchip.bad .cd{background:var(--bad-dot)} .vchip.warn .cd{background:var(--warn-dot)}
.verdict .vgo{margin-top:14px; width:100%; border:0; border-radius:13px; padding:12px; cursor:pointer;
  font-family:var(--display); font-weight:700; font-size:14.5px; color:#fff; display:flex; align-items:center; justify-content:center; gap:8px;
  background:linear-gradient(180deg,var(--brand),var(--brand-deep)); box-shadow:0 8px 16px -10px rgba(3,14,24,.5)}
.verdict .vgo svg{width:17px;height:17px}
.verdict .vgo:active{transform:translateY(1px)}

/* ---------- Abschnitte / Listen ---------- */
.sechead{display:flex; align-items:center; gap:9px; margin:22px 0 8px; padding:0 18px}
.sechead .ci{width:22px;height:22px;border-radius:7px; display:grid;place-items:center; color:var(--brand-text);
  background:var(--paper-3); flex:none}
.sechead .ci svg{width:14px;height:14px}
.sechead h3{margin:0; font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-2)}
.sechead .rule{height:1px; background:var(--line); flex:1}
.sechead .cnt{font-size:12px; font-weight:700; color:var(--ink-3); font-family:var(--display)}

.list{padding:0 18px}
.item{display:flex; align-items:center; gap:12px; padding:13px 0; border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .st{width:11px;height:11px;border-radius:50%; flex:none; position:relative}
.item .st.ok{background:var(--ok-dot)} .item .st.warn{background:var(--warn-dot)} .item .st.bad{background:var(--bad-dot)}
.item .st.bad::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--bad-dot);opacity:.4}
.item .info{flex:1; min-width:0}
.item .info .t{font-weight:700; font-size:15px; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.item .info .s{font-size:12px; color:var(--ink-3); font-weight:600; margin-top:2px}
.item .info .s b{color:var(--ink-2); font-weight:700}
.stepper{display:flex; align-items:center; flex:none; border:1px solid var(--line); border-radius:12px; background:var(--paper-2); overflow:hidden}
.stepper button{width:36px;height:38px; border:0; background:transparent; cursor:pointer; display:grid; place-items:center; color:var(--brand-text); transition:background .12s}
.stepper button:hover{background:var(--paper-3)}
.stepper button:active{background:var(--brand); color:#fff}
.stepper button:disabled{color:var(--ink-3); opacity:.5; cursor:not-allowed; background:transparent}
.stepper button svg{width:17px;height:17px}
.stepper .val{min-width:34px; text-align:center; font-family:var(--display); font-weight:800; font-size:17px; font-variant-numeric:tabular-nums;
  border-left:1px solid var(--line); border-right:1px solid var(--line); align-self:stretch; display:grid; place-items:center; padding:0 2px}
.item.bad .val{color:var(--bad-ink)}

/* ---------- Einkaufsliste ---------- */
.buyhead{margin:14px 18px 2px; border-radius:18px; padding:14px 16px; display:flex; align-items:center; gap:13px; box-shadow:var(--shadow)}
.buyhead.has{background:linear-gradient(150deg,#022A3F,#063A55); color:#EAF4FC}
.buyhead.empty{background:var(--ok-bg); border:1px solid color-mix(in oklab, var(--ok-dot) 30%, transparent)}
.buyhead .bn{font-family:var(--display); font-weight:900; font-size:30px; line-height:1; font-variant-numeric:tabular-nums; flex:none}
.buyhead.has .bn{color:var(--brand-glow)}
.buyhead .bt{min-width:0}
.buyhead .bt b{display:block; font-family:var(--display); font-weight:800; font-size:16px; letter-spacing:-.01em}
.buyhead.empty .bt b{color:var(--ok-ink)}
.buyhead .bt span{font-size:12.5px; font-weight:600; opacity:.85}
.buyhead.has .bt span{color:#A9CFe6}
.buyhead .bicon{width:44px;height:44px;border-radius:13px;flex:none;display:grid;place-items:center; background:var(--ok-dot); color:#fff}
.buyhead .bicon svg{width:24px;height:24px}

.buy{display:flex; align-items:center; gap:13px; padding:13px 0; border-top:1px solid var(--line)}
.buy:first-child{border-top:0}
.buy .chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--line); background:var(--paper); flex:none; cursor:pointer;
  display:grid; place-items:center; color:transparent; transition:.12s}
.buy .chk:hover{border-color:var(--brand)}
.buy.done .chk{background:var(--ok-dot); border-color:var(--ok-dot); color:#fff}
.buy .chk svg{width:16px;height:16px}
.buy .info{flex:1; min-width:0}
.buy .info .t{font-weight:700; font-size:15px}
.buy.done .info .t{text-decoration:line-through; color:var(--ink-3)}
.buy .info .s{font-size:12px; color:var(--ink-3); font-weight:600; margin-top:2px}
.buy .need{font-family:var(--display); font-weight:800; font-size:14px; flex:none; text-align:right; color:var(--brand-text)}
.buy .need small{display:block; font-size:11px; color:var(--ink-3); font-weight:700; letter-spacing:.03em; margin-top:1px; text-transform:uppercase}
.buy.done .need{color:var(--ink-3)}

.actions{display:flex; gap:10px; padding:18px 18px 6px}
.btn{flex:1; border-radius:13px; padding:12px; cursor:pointer; font-family:var(--display); font-weight:700; font-size:14px;
  display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1px solid var(--line); background:var(--paper); color:var(--ink)}
.btn svg{width:17px;height:17px}
.btn:active{transform:translateY(1px)}
.btn.primary{border-color:transparent; color:#fff; background:linear-gradient(180deg,var(--brand),var(--brand-deep)); box-shadow:0 8px 16px -10px rgba(3,14,24,.5)}
.btn.ok{border-color:transparent; color:#fff; background:linear-gradient(180deg,var(--ok-dot),#0C8B44)}
.btn:disabled{opacity:.5; cursor:not-allowed}

/* ---------- Verwalten ---------- */
.mgmt{padding:0 18px}
.mgcard{border:1px solid var(--line); border-radius:16px; padding:12px 13px; margin-bottom:10px; background:var(--paper-2)}
.mgcard .r1{display:flex; align-items:center; gap:10px}
.mgcard .st{width:10px;height:10px;border-radius:50%;flex:none}
.mgcard input.name{flex:1; min-width:0; border:0; background:transparent; font-family:var(--display); font-weight:700; font-size:15px; color:var(--ink); padding:4px 2px}
.mgcard input.name:focus{outline:none; border-bottom:2px solid var(--brand)}
.mgcard .del{width:32px;height:32px;border-radius:9px;border:1px solid var(--line); background:var(--paper); color:var(--bad-ink); cursor:pointer; display:grid; place-items:center; flex:none}
.mgcard .del svg{width:15px;height:15px}
.mgcard .r2{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:11px}
.fld{display:flex; flex-direction:column; gap:4px}
.fld label{font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-3); padding-left:2px}
.fld input, .fld select{border:1px solid var(--line); border-radius:9px; padding:8px 8px; background:var(--paper); color:var(--ink);
  font-family:var(--display); font-weight:700; font-size:14px; font-variant-numeric:tabular-nums; width:100%}
.fld select{font-family:var(--ui); font-weight:600; font-size:13px}
.fld input:focus, .fld select:focus{outline:none; border-color:var(--brand); box-shadow:0 0 0 3px rgba(0,159,227,.16)}
.mgsub{font-size:11px; color:var(--ink-3); font-weight:600; margin:2px 2px 14px; line-height:1.5}
.addbtn{width:100%; border:1.5px dashed var(--line); border-radius:14px; padding:13px; background:transparent; color:var(--brand-text);
  font-family:var(--display); font-weight:700; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:8px}
.addbtn:hover{border-color:var(--brand); background:var(--paper-2)}
.addbtn svg{width:18px;height:18px}
.dangerlink{display:inline-flex; align-items:center; gap:7px; background:none; border:0; color:var(--ink-3); font-weight:700; font-size:13px; cursor:pointer; padding:8px 2px}
.dangerlink:hover{color:var(--bad-ink)}
.dangerlink svg{width:15px;height:15px}

.infobox{margin:6px 18px 2px; border-radius:14px; border:1px dashed var(--line); background:var(--paper-2); padding:13px 14px; display:flex; gap:11px}
.infobox svg{width:18px;height:18px;color:var(--brand-text); flex:none; margin-top:1px}
.infobox p{margin:0; font-size:12.5px; color:var(--ink-2); font-weight:500; line-height:1.5}
.infobox p b{color:var(--ink); font-weight:700}

/* ---------- Empty ---------- */
.empty{text-align:center; padding:46px 30px}
.empty .ec{width:66px;height:66px;border-radius:20px; margin:0 auto 16px; display:grid; place-items:center; color:var(--brand-text); background:var(--paper-3)}
.empty .ec svg{width:32px;height:32px}
.empty h2{margin:0 0 6px; font-family:var(--display); font-weight:800; font-size:19px}
.empty p{margin:0 0 20px; font-size:13.5px; color:var(--ink-3); font-weight:500; line-height:1.5}

/* ---------- Bottom-Nav ---------- */
.tabnav{display:flex; border-top:1px solid var(--line); background:color-mix(in oklab, var(--paper) 92%, transparent);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); padding:8px 8px calc(8px + env(safe-area-inset-bottom)); flex:none}
.tabnav button{flex:1; border:0; background:transparent; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px;
  padding:5px 4px; color:var(--ink-3); position:relative; border-radius:12px; transition:color .15s}
.tabnav button .ib{width:24px;height:24px; display:grid; place-items:center}
.tabnav button svg{width:23px;height:23px}
.tabnav button span{font-size:11px; font-weight:700; letter-spacing:.01em}
.tabnav button.on{color:var(--brand-text)}
.tabnav button .nbadge{position:absolute; top:0; left:calc(50% + 7px); min-width:18px; height:18px; padding:0 4px; border-radius:9px;
  background:var(--bad-dot); color:#fff; font-size:11px; font-weight:800; font-family:var(--display); display:grid; place-items:center;
  border:2px solid var(--paper)}

/* ---------- Toast ---------- */
.toast{position:absolute; left:50%; bottom:84px; transform:translate(-50%,20px); z-index:80; opacity:0; pointer-events:none;
  background:#0B1A26; color:#EAF4FC; font-weight:600; font-size:13.5px; padding:11px 16px; border-radius:12px; box-shadow:var(--shadow-lg);
  display:flex; align-items:center; gap:9px; max-width:88%; transition:opacity .25s, transform .25s}
.toast.show{opacity:1; transform:translate(-50%,0)}
.toast svg{width:17px;height:17px;color:var(--ok-dot); flex:none}
.tap{-webkit-tap-highlight-color:transparent}
</style>
</head>
<body>

<div class="stage-note">
  <span class="lbl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="3"/><path d="M12 18h.01"/></svg> Vorschau</span>
  <b>VSG Getränkelager</b><br>
  So sieht die App auf dem Handy aus. Nach dem Spieltag Bestand eintragen — das nächste Team sieht sofort, ob eingekauft werden muss.
</div>

<div class="phone">
  <div class="notch"></div>

  <div class="splash" id="splash">
    <img src="wappen.png" alt="VSG Kleinsteinbach">
    <div class="cap">Getränkelager</div>
    <div class="splash-bar"><span></span></div>
  </div>

  <div class="app">
    <div class="topbar">
      <div class="crest"><img src="icon-192.png" alt=""></div>
      <div class="brand"><b>Getränkelager</b><span>VSG Kleinsteinbach</span></div>
      <button class="mebtn tap" id="mebtn" aria-label="Team wählen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>
        <span class="who"><small>Team</small><b id="mename">—</b></span>
      </button>
    </div>

    <div class="scroll" id="scroll">
      <!-- LAGER -->
      <section class="view on" id="view-lager"></section>
      <!-- EINKAUF -->
      <section class="view" id="view-einkauf"></section>
      <!-- VERWALTEN -->
      <section class="view" id="view-verwalten"></section>
    </div>

    <nav class="tabnav" id="tabnav">
      <button class="on tap" data-tab="lager">
        <span class="ib"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5 12 4l9 4.5v7L12 20l-9-4.5z"/><path d="M3 8.5 12 13l9-4.5M12 13v7"/></svg></span>
        <span>Lager</span>
      </button>
      <button class="tap" data-tab="einkauf">
        <span class="ib"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h2.2l2.3 12.4a1.6 1.6 0 0 0 1.6 1.3h8.6a1.6 1.6 0 0 0 1.6-1.2l1.7-7.5H5.5"/></svg></span>
        <span>Einkauf</span>
        <em class="nbadge" id="tabbadge" hidden></em>
      </button>
      <button class="tap" data-tab="verwalten">
        <span class="ib"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M4 12h16M4 18h7"/><circle cx="18" cy="6" r="2.2"/><circle cx="14" cy="18" r="2.2"/></svg></span>
        <span>Verwalten</span>
      </button>
    </nav>

    <div class="toast" id="toast"></div>
  </div>
</div>

<script>
/* ============================================================
   VSG Getränkelager — Datenschicht
   Aktuell: LocalDriver (localStorage, teilt sich über Tabs am Gerät).
   Später: SupabaseDriver mit gleichem Interface für echtes Team-Teilen.
   Interface: load() -> {items, meta}; setQty(id,qty); upsert(item);
              remove(id); setMeta(patch); subscribe(cb)
   ============================================================ */
const KEY = 'vsg.getraenke.v1';
const ME_KEY = 'vsg.getraenke.me';

const CATS = ['Wasser', 'Softdrinks', 'Bier & Radler'];
const TEAMS = ['Herren I', 'Herren II', 'Damen I', 'Damen II', 'Mixed', 'Jugend'];

const DEFAULTS = [
  { name:'Wasser still',        cat:'Wasser',        unit:'Sixpack', soll:4, schwelle:1, qty:4 },
  { name:'Wasser spritzig',     cat:'Wasser',        unit:'Sixpack', soll:4, schwelle:1, qty:2 },
  { name:'Apfelschorle',        cat:'Wasser',        unit:'Sixpack', soll:3, schwelle:1, qty:1 },
  { name:'Spezi (Paulaner)',    cat:'Softdrinks',    unit:'Kiste',   soll:2, schwelle:0, qty:2 },
  { name:'Cola',                cat:'Softdrinks',    unit:'Kiste',   soll:2, schwelle:0, qty:1 },
  { name:'Fanta',               cat:'Softdrinks',    unit:'Kiste',   soll:1, schwelle:0, qty:1 },
  { name:'Bier',                cat:'Bier & Radler', unit:'Kiste',   soll:2, schwelle:0, qty:0 },
  { name:'Radler',              cat:'Bier & Radler', unit:'Kiste',   soll:1, schwelle:0, qty:1 },
  { name:'Alkoholfrei',         cat:'Bier & Radler', unit:'Kiste',   soll:1, schwelle:0, qty:1 },
];

const uid = () => 'i' + Math.random().toString(36).slice(2, 9);

const LocalDriver = {
  _read(){
    try { const raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); } catch(e){}
    return null;
  },
  _write(data){ try { localStorage.setItem(KEY, JSON.stringify(data)); } catch(e){} },
  seed(){
    const data = { items: DEFAULTS.map((d,i) => ({ id: uid(), order:i, ...d })),
                   meta: { updatedAt: Date.now(), updatedBy: null } };
    this._write(data); return data;
  },
  async load(){ return this._read() || this.seed(); },
  async setQty(id, qty, by){
    const d = this._read(); if (!d) return;
    const it = d.items.find(x => x.id === id); if (!it) return;
    it.qty = Math.max(0, qty);
    d.meta = { updatedAt: Date.now(), updatedBy: by || d.meta.updatedBy };
    this._write(d);
  },
  async upsert(item, by){
    const d = this._read() || { items:[], meta:{} };
    const i = d.items.findIndex(x => x.id === item.id);
    if (i >= 0) d.items[i] = { ...d.items[i], ...item };
    else d.items.push({ id: uid(), order: d.items.length, qty:0, ...item });
    d.meta = { updatedAt: Date.now(), updatedBy: by || d.meta.updatedBy };
    this._write(d);
  },
  async remove(id){ const d=this._read(); if(!d) return; d.items=d.items.filter(x=>x.id!==id); this._write(d); },
  async resetDefaults(){ return this.seed(); },
  subscribe(cb){
    window.addEventListener('storage', (e) => { if (e.key === KEY) cb(); });
  },
};
const DB = LocalDriver;

/* ============================================================ State */
let state = { items: [], meta: {}, me: null, tab: 'lager' };

function status(it){
  if (it.qty >= it.soll) return 'ok';
  if (it.qty <= it.schwelle) return 'bad';
  return 'warn';
}
function plural(unit, n){
  if (n === 1) return unit;
  if (/sixpack/i.test(unit)) return unit + 's';
  if (/kiste/i.test(unit)) return unit.replace(/e$/, 'en');
  if (/karton/i.test(unit)) return 'Kartons';
  return unit + (/[^s]$/.test(unit) ? '' : '');
}
function need(it){ return Math.max(0, it.soll - it.qty); }
function relTime(ts){
  if (!ts) return 'noch nie';
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return 'gerade eben';
  const m = Math.floor(s/60); if (m < 60) return `vor ${m} Min.`;
  const h = Math.floor(m/60); if (h < 24) return `vor ${h} Std.`;
  const d = Math.floor(h/24); if (d === 1) return 'gestern';
  if (d < 7) return `vor ${d} Tagen`;
  return new Date(ts).toLocaleDateString('de-DE', { day:'2-digit', month:'2-digit' });
}
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function catIcon(cat){
  if (cat === 'Wasser') return '<path d="M12 3s6 6.5 6 10.5a6 6 0 0 1-12 0C6 9.5 12 3 12 3z"/>';
  if (cat === 'Softdrinks') return '<path d="M6 3h12l-1 4H7z"/><path d="M7 7l1.2 12.2A2 2 0 0 0 10.2 21h3.6a2 2 0 0 0 2-1.8L17 7"/><path d="M9 12h6"/>';
  return '<path d="M6 5h9l1 3v10a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V9z"/><path d="M15 8h2.5A1.5 1.5 0 0 1 19 9.5v3A1.5 1.5 0 0 1 17.5 14H16"/><path d="M8 3v2M11 3v2"/>';
}

/* ============================================================ Render */
const $ = (s) => document.querySelector(s);
function orderedItems(){ return [...state.items].sort((a,b)=>(a.order??0)-(b.order??0)); }
function grouped(){
  const items = orderedItems();
  const groups = [];
  CATS.forEach(c => { const g = items.filter(i => i.cat === c); if (g.length) groups.push([c, g]); });
  const rest = items.filter(i => !CATS.includes(i.cat));
  if (rest.length) groups.push(['Weitere', rest]);
  return groups;
}
function summary(){
  const bad = state.items.filter(i => status(i)==='bad');
  const warn = state.items.filter(i => status(i)==='warn');
  return { bad, warn, buy: [...bad, ...warn] };
}

function renderLager(){
  const el = $('#view-lager');
  if (!state.items.length){
    el.innerHTML = emptyState();
    el.querySelector('#seedBtn')?.addEventListener('click', async () => { await DB.resetDefaults(); await refresh(); toast('Standard-Sortiment geladen'); });
    return;
  }
  const { bad, warn } = summary();
  let v;
  if (bad.length){
    v = { cls:'bad', icon:'<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
      h:`${bad.length} ${bad.length===1?'Sorte':'Sorten'} nachkaufen`, s:'Unter dem Mindestbestand — vor dem Spieltag besorgen.',
      chips: bad.map(i=>`<span class="vchip bad"><span class="cd"></span>${esc(i.name)}</span>`).join('') };
  } else if (warn.length){
    v = { cls:'warn', icon:'<path d="M12 8v4l2.5 1.5"/><circle cx="12" cy="12" r="9"/>',
      h:'Bald nachkaufen', s:`${warn.length} ${warn.length===1?'Sorte wird':'Sorten werden'} knapp — beim nächsten Einkauf mitnehmen.`,
      chips: warn.map(i=>`<span class="vchip warn"><span class="cd"></span>${esc(i.name)}</span>`).join('') };
  } else {
    v = { cls:'ok', icon:'<path d="M20 6 9 17l-5-5"/>',
      h:'Alles aufgefüllt', s:'Der Bestand reicht für den nächsten Spieltag.', chips:'' };
  }
  const showGo = (bad.length + warn.length) > 0;

  const groupsHtml = grouped().map(([cat, items]) => `
    <div class="sechead">
      <span class="ci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${catIcon(cat)}</svg></span>
      <h3>${esc(cat)}</h3><span class="rule"></span>
      <span class="cnt">${items.length}</span>
    </div>
    <div class="list">
      ${items.map(it => {
        const st = status(it);
        return `<div class="item ${st}" data-id="${it.id}">
          <span class="st ${st}"></span>
          <div class="info">
            <div class="t">${esc(it.name)}</div>
            <div class="s"><b>${it.qty}</b> von ${it.soll} ${esc(plural(it.unit, it.soll))} · Nachkauf ab ${it.schwelle}</div>
          </div>
          <div class="stepper" role="group" aria-label="${esc(it.name)} Menge">
            <button class="tap" data-act="dec" data-id="${it.id}" aria-label="weniger" ${it.qty<=0?'disabled':''}>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg>
            </button>
            <span class="val" aria-live="polite">${it.qty}</span>
            <button class="tap" data-act="inc" data-id="${it.id}" aria-label="mehr">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </div>
        </div>`;
      }).join('')}
    </div>`).join('');

  el.innerHTML = `
    <div class="pagehead">
      <h1>Lagerbestand</h1>
      <div class="meta"><span class="now"></span>Aktualisiert ${relTime(state.meta.updatedAt)}${state.meta.updatedBy?` · ${esc(state.meta.updatedBy)}`:''}</div>
    </div>
    <div class="verdict ${v.cls}">
      <div class="vhead">
        <div class="vicon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">${v.icon}</svg></div>
        <div><h2>${v.h}</h2><div class="vsub">${v.s}</div></div>
      </div>
      ${v.chips?`<div class="vchips">${v.chips}</div>`:''}
      ${showGo?`<button class="vgo tap" id="goBuy">Zur Einkaufsliste
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>`:''}
    </div>
    ${groupsHtml}`;

  el.querySelector('#goBuy')?.addEventListener('click', () => switchTab('einkauf'));
  el.querySelectorAll('.stepper button[data-act]').forEach(b => {
    b.addEventListener('click', () => step(b.dataset.id, b.dataset.act === 'inc' ? 1 : -1));
  });
}

function renderEinkauf(){
  const el = $('#view-einkauf');
  const { buy, bad, warn } = summary();
  if (!buy.length){
    el.innerHTML = `
      <div class="pagehead"><h1>Einkaufsliste</h1></div>
      <div class="buyhead empty">
        <div class="bicon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
        <div class="bt"><b>Nichts einzukaufen</b><span>Alle Sorten sind ausreichend bevorratet.</span></div>
      </div>`;
    return;
  }
  const totalUnits = buy.reduce((s,i)=>s+need(i), 0);
  const subParts = [];
  if (bad.length) subParts.push(`${bad.length} nachkaufen`);
  if (warn.length) subParts.push(`${warn.length} werden knapp`);
  subParts.push(`${totalUnits} Gebinde bis Soll`);
  const rows = buy.sort((a,b)=> (status(a)==='bad'?0:1)-(status(b)==='bad'?0:1)).map(it => {
    const st = status(it), n = need(it);
    return `<div class="buy" data-id="${it.id}">
      <button class="chk tap" data-buy="${it.id}" aria-label="als gekauft markieren">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </button>
      <div class="info">
        <div class="t">${esc(it.name)}</div>
        <div class="s">${st==='bad'?'Leer / unter Mindestbestand':'Wird knapp'} · ${it.qty} von ${it.soll} da</div>
      </div>
      <div class="need">+${n} <small>${esc(plural(it.unit, n))}</small></div>
    </div>`;
  }).join('');

  el.innerHTML = `
    <div class="pagehead"><h1>Einkaufsliste</h1></div>
    <div class="buyhead has">
      <div class="bn">${buy.length}</div>
      <div class="bt"><b>${buy.length===1?'Sorte':'Sorten'} unter Soll</b><span>${subParts.join(' · ')}</span></div>
    </div>
    <div class="list" style="margin-top:6px">${rows}</div>
    <div class="actions">
      <button class="btn tap" id="shareBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v14"/></svg>
        Liste teilen
      </button>
      <button class="btn ok tap" id="doneBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        Eingekauft
      </button>
    </div>
    <div class="mgsub" style="text-align:center">„Eingekauft" füllt alle angehakten Sorten auf ihren Soll-Bestand auf.</div>`;

  el.querySelectorAll('.chk[data-buy]').forEach(b => b.addEventListener('click', () => {
    b.closest('.buy').classList.toggle('done');
    updateDoneBtn();
  }));
  el.querySelector('#shareBtn').addEventListener('click', shareList);
  el.querySelector('#doneBtn').addEventListener('click', completeBought);
  updateDoneBtn();
}
function updateDoneBtn(){
  const el = $('#view-einkauf'); if (!el) return;
  const any = el.querySelectorAll('.buy.done').length;
  const btn = el.querySelector('#doneBtn'); if (!btn) return;
  btn.disabled = any === 0;
  btn.lastChild.textContent = any ? ` Eingekauft (${any})` : ' Eingekauft';
}

function renderVerwalten(){
  const el = $('#view-verwalten');
  const items = orderedItems();
  const rows = items.map(it => {
    const st = status(it);
    const opts = CATS.concat(CATS.includes(it.cat)?[]:[it.cat]).map(c => `<option ${c===it.cat?'selected':''}>${esc(c)}</option>`).join('');
    return `<div class="mgcard" data-id="${it.id}">
      <div class="r1">
        <span class="st ${st}" style="background:var(--${st}-dot)"></span>
        <input class="name" value="${esc(it.name)}" data-f="name" aria-label="Name">
        <button class="del tap" data-del="${it.id}" aria-label="löschen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-14"/></svg>
        </button>
      </div>
      <div class="r2">
        <div class="fld"><label>Kategorie</label><select data-f="cat">${opts}</select></div>
        <div class="fld"><label>Gebinde</label><input data-f="unit" value="${esc(it.unit)}"></div>
        <div class="fld"><label>Soll</label><input data-f="soll" type="number" min="1" inputmode="numeric" value="${it.soll}"></div>
      </div>
      <div class="r2" style="grid-template-columns:1fr 1fr 1fr; margin-top:8px">
        <div class="fld"><label>Nachkauf ab</label><input data-f="schwelle" type="number" min="0" inputmode="numeric" value="${it.schwelle}"></div>
        <div class="fld"><label>Aktuell</label><input data-f="qty" type="number" min="0" inputmode="numeric" value="${it.qty}"></div>
        <div></div>
      </div>
    </div>`;
  }).join('');

  el.innerHTML = `
    <div class="pagehead"><h1>Verwalten</h1></div>
    <div class="infobox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
      <p><b>Sortiment festlegen.</b> „Soll" ist der Ziel-Bestand für einen Spieltag, „Nachkauf ab" die Schwelle, ab der die Ampel rot wird. Änderungen speichern automatisch.</p>
    </div>
    <div class="mgmt" style="margin-top:14px">
      ${rows}
      <button class="addbtn tap" id="addItem">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        Sorte hinzufügen
      </button>
      <div style="text-align:center; margin-top:6px">
        <button class="dangerlink tap" id="resetBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
          Auf Standard-Sortiment zurücksetzen
        </button>
      </div>
    </div>`;

  el.querySelectorAll('.mgcard').forEach(card => {
    const id = card.dataset.id;
    card.querySelectorAll('[data-f]').forEach(inp => {
      const ev = inp.tagName === 'SELECT' ? 'change' : 'change';
      inp.addEventListener(ev, () => saveField(id, card));
    });
    card.querySelector('[data-del]').addEventListener('click', () => removeItem(id));
  });
  el.querySelector('#addItem').addEventListener('click', addItem);
  el.querySelector('#resetBtn').addEventListener('click', resetAll);
}

/* ============================================================ Actions */
async function step(id, delta){
  const it = state.items.find(x => x.id === id); if (!it) return;
  const q = Math.max(0, it.qty + delta);
  it.qty = q; // optimistisch
  await DB.setQty(id, q, state.me);
  await refresh();
}
async function saveField(id, card){
  const it = state.items.find(x => x.id === id); if (!it) return;
  const patch = { id };
  card.querySelectorAll('[data-f]').forEach(inp => {
    const f = inp.dataset.f;
    patch[f] = (f==='soll'||f==='schwelle'||f==='qty') ? Math.max(0, parseInt(inp.value||'0',10)||0) : inp.value.trim();
  });
  if (!patch.name) patch.name = it.name;
  await DB.upsert(patch, state.me);
  await refresh();
}
async function addItem(){
  await DB.upsert({ name:'Neue Sorte', cat:CATS[0], unit:'Kiste', soll:1, schwelle:0, qty:0 }, state.me);
  await refresh();
  const cards = document.querySelectorAll('#view-verwalten .mgcard');
  const last = cards[cards.length-1];
  if (last){ last.scrollIntoView({behavior:'smooth', block:'center'}); const n = last.querySelector('.name'); n.focus(); n.select(); }
}
async function removeItem(id){
  const it = state.items.find(x=>x.id===id);
  if (!confirm(`„${it?.name||'Sorte'}" wirklich aus dem Sortiment entfernen?`)) return;
  await DB.remove(id); await refresh(); toast('Sorte entfernt');
}
async function resetAll(){
  if (!confirm('Sortiment und Bestände auf die Standard-Werte zurücksetzen? Deine Anpassungen gehen verloren.')) return;
  await DB.resetDefaults(); await refresh(); toast('Auf Standard zurückgesetzt');
}
async function completeBought(){
  const el = $('#view-einkauf');
  const ids = [...el.querySelectorAll('.buy.done')].map(b => b.dataset.id);
  if (!ids.length) return;
  for (const id of ids){ const it = state.items.find(x=>x.id===id); if (it) await DB.setQty(id, it.soll, state.me); }
  await refresh();
  toast(`${ids.length} ${ids.length===1?'Sorte':'Sorten'} aufgefüllt`);
}
async function shareList(){
  const { buy, bad } = summary();
  const lines = buy.sort((a,b)=> (status(a)==='bad'?0:1)-(status(b)==='bad'?0:1))
    .map(i => `• ${i.name}: +${need(i)} ${plural(i.unit, need(i))}${status(i)==='bad'?' (leer)':''}`);
  const text = `🏐 VSG Getränke-Einkauf\n${new Date().toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'})}\n\n${lines.join('\n')}\n\n(${buy.length} Sorten, ${bad.length} leer)`;
  try {
    if (navigator.share){ await navigator.share({ title:'VSG Getränke-Einkauf', text }); return; }
  } catch(e){ if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(text); toast('Liste kopiert — z. B. in WhatsApp einfügen'); }
  catch(e){ prompt('Einkaufsliste kopieren:', text); }
}

/* ============================================================ Team / Me */
function renderMe(){ $('#mename').textContent = state.me || 'wählen'; }
function chooseMe(){
  const cur = state.me || '';
  const list = TEAMS.join(', ');
  const val = prompt(`Für welches Team trägst du ein?\n\nVorschläge: ${list}`, cur);
  if (val === null) return;
  state.me = val.trim() || null;
  try { localStorage.setItem(ME_KEY, state.me || ''); } catch(e){}
  renderMe(); toast(state.me ? `Team: ${state.me}` : 'Team entfernt');
}

/* ============================================================ Tabs / Refresh */
function switchTab(tab){
  state.tab = tab;
  document.querySelectorAll('#tabnav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('on'));
  $('#view-'+tab).classList.add('on');
  $('#scroll').scrollTop = 0;
  renderActive();
}
function renderActive(){
  if (state.tab === 'lager') renderLager();
  else if (state.tab === 'einkauf') renderEinkauf();
  else renderVerwalten();
}
function updateBadges(){
  const { buy } = summary();
  const badge = $('#tabbadge');
  if (buy.length){ badge.textContent = buy.length; badge.hidden = false; }
  else badge.hidden = true;
}
async function refresh(){
  const data = await DB.load();
  state.items = data.items || [];
  state.meta = data.meta || {};
  updateBadges();
  renderActive();
}

/* ============================================================ Toast */
let toastT;
function toast(msg){
  const t = $('#toast');
  t.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>${esc(msg)}`;
  t.classList.add('show'); clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ============================================================ Boot */
function setVH(){ document.documentElement.style.setProperty('--appvh', window.innerHeight + 'px'); }
setVH(); window.addEventListener('resize', setVH);

document.getElementById('tabnav').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-tab]'); if (b) switchTab(b.dataset.tab);
});
document.getElementById('mebtn').addEventListener('click', chooseMe);

(async function init(){
  try { const m = localStorage.getItem(ME_KEY); if (m) state.me = m; } catch(e){}
  renderMe();
  await refresh();
  DB.subscribe(refresh);
  setTimeout(() => { const s = $('#splash'); s.classList.add('hide'); setTimeout(()=>s.remove(), 600); }, 1250);
  if ('serviceWorker' in navigator){
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
  }
})();
</script>
</body>
